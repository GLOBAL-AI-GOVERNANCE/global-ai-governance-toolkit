[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-ai-governance-toolkit"
version = "2.7.0"
description = "Local-first AI governance reference tooling"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
gaig = "gaig_toolkit.cli:main"
# Deprecated alias of gaig.

[tool.setuptools.packages.find]
where = ["."]
include = ["gaig_toolkit*", "automation*"]

[tool.setuptools.package-data]
automation = [
  "contracts/**/*.json",
  "profiles/**/*.json",
  "frameworks/**/*.json",
  "frameworks/**/*.md",
  "policy-as-code/*.yaml",
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["automation/tests"]
addopts = "-q -p no:cacheprovider"
