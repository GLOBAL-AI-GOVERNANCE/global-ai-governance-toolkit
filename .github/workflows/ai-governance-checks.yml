name: AI Governance Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: read

jobs:
  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check reachable history privacy
        run: python3 -B tools/check_history_privacy.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate repository integrity
        run: |
          python -B automation/scripts/validate_repository.py

      - name: Install and verify flagship CLI
        run: |
          python -m pip install --disable-pip-version-check --no-deps .
          gag --version
          python -B automation/scripts/generate_inventory_templates.py --check
          python -B automation/scripts/generate_browser_contract_bundle.py --check

      - name: Verify schema-policy-runtime and Decision Pack behavior
        run: |
          python -B -m unittest discover \
            -s automation/tests \
            -p "test_*.py" \
            -v

      - name: Verify agent-action assurance example
        run: |
          python -B -m unittest discover \
            -s examples/agent_action_assurance/tests \
            -p "test_*.py" \
            -v

      - name: Verify checked-in Decision Pack is reproducible
        run: |
          python -B automation/scripts/build_decision_pack_example.py --check

      - name: Verify documented quick start
        run: |
          python -B automation/scripts/run_governance_checks.py \
            automation/sample-data/sample-ai-inventory.csv \
            --outdir "${{ runner.temp }}/governance-reports/quick-start" \
            --fail-on none

          summary="${{ runner.temp }}/governance-reports/quick-start/decision-pack/executive-summary.md"

          test -f "$summary"
          grep -q "BLOCKED BY CRITICAL FINDINGS" "$summary"

      - name: Verify valid inventory passes by default
        run: |
          python -B automation/scripts/run_governance_checks.py \
            automation/fixtures/valid-ai-inventory.csv \
            --outdir "${{ runner.temp }}/governance-reports/valid"

      - name: Verify critical policy findings are blocked
        shell: bash
        run: |
          set +e

          python -B automation/scripts/run_governance_checks.py \
            automation/fixtures/critical-ai-inventory.csv \
            --outdir "${{ runner.temp }}/governance-reports/critical"

          status=$?
          set -e

          if [[ "$status" -ne 1 ]]; then
            echo "Expected critical inventory to exit 1; received $status."
            exit 1
          fi

          report="${{ runner.temp }}/governance-reports/critical/governance-validation-report.md"

          test -f "$report"
          test ! -d "${{ runner.temp }}/governance-reports/critical/decision-pack"
          grep -q "\[GAI-AUTO-001\]" "$report"
          grep -q "\[GAI-AUTO-003\]" "$report"
          grep -q "CRITICAL - Missing named owner" "$report"
          grep -q "CRITICAL - Shutdown path is missing" "$report"

      - name: Verify explicit report-only mode
        run: |
          python -B automation/scripts/run_governance_checks.py \
            automation/fixtures/critical-ai-inventory.csv \
            --outdir "${{ runner.temp }}/governance-reports/report-only" \
            --fail-on none

          report="${{ runner.temp }}/governance-reports/report-only/governance-validation-report.md"
          summary="${{ runner.temp }}/governance-reports/report-only/decision-pack/executive-summary.md"

          test -f "$report"
          test -f "$summary"
          grep -q "\[GAI-AUTO-001\]" "$report"
          grep -q "CRITICAL - Missing named owner" "$report"
          grep -q "BLOCKED BY CRITICAL FINDINGS" "$summary"

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-reports
          path: ${{ runner.temp }}/governance-reports/
          if-no-files-found: error

  action-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action on a valid inventory
        id: valid
        uses: ./
        with:
          inventory: automation/fixtures/valid-ai-inventory.csv
          outdir: ${{ runner.temp }}/action-valid

      - name: Run action on a critical inventory
        id: critical
        continue-on-error: true
        uses: ./
        with:
          inventory: automation/fixtures/critical-ai-inventory.csv
          outdir: ${{ runner.temp }}/action-critical

      - name: Verify action outcomes
        shell: bash
        env:
          VALID_EXIT: ${{ steps.valid.outputs.exit-code }}
          VALID_GATE: ${{ steps.valid.outputs.gate-state }}
          CRITICAL_OUTCOME: ${{ steps.critical.outcome }}
        run: |
          set -euo pipefail
          test "$VALID_EXIT" = "0"
          test "$VALID_GATE" = "PASSED_CURRENT_AUTOMATED_CHECKS"
          test -d "${{ runner.temp }}/action-valid/decision-pack"
          test "$CRITICAL_OUTCOME" = "failure"
          test "$GAG_CHECK_EXIT_CODE" = "1"
          test "$GAG_CHECK_GATE_STATE" = "BLOCKED"
          grep -q "CRITICAL - Missing named owner" "${{ runner.temp }}/action-critical/governance-validation-report.md"
