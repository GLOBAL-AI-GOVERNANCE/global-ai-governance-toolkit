name: Static browser Pages deployment

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify static browser boundary
        shell: bash
        run: |
          test -f web/index.html
          test -f web/app.mjs
          test -f web/governance-engine.mjs
          test -f web/contracts.generated.mjs
          test -f web/styles.css
          ! grep -RIE '(fetch\(|XMLHttpRequest|WebSocket|sendBeacon|navigator\.serviceWorker)' web --include='*.mjs' --include='*.js'
          python -B automation/scripts/generate_browser_contract_bundle.py --check
          node --check web/app.mjs
          node --check web/governance-engine.mjs

      - name: Stage static site
        shell: bash
        run: |
          mkdir _site
          cp -R web/. _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
