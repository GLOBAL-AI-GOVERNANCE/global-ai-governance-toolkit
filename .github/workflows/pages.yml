name: Static browser Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify static browser boundary
        shell: bash
        run: |
          test -f web/index.html
          test -f web/start.html
          test -f web/start.mjs
          test -f web/app.mjs
          test -f web/governance-engine.mjs
          test -f web/finding-guidance.mjs
          test -f web/contracts.generated.mjs
          test -f web/styles.css
          test -f web/machine-interface.json
          test -f web/ai-system-inventory-template.csv
          test -f web/sample-ai-inventory.csv
          test -f web/maturity/index.html
          test -f web/maturity/app.mjs
          test -f web/maturity/maturity-engine.mjs
          test -f web/maturity/maturity-viewer.mjs
          test -f web/maturity/catalog.generated.mjs
          test -f web/maturity/styles.css
          test -f web/lead-agent/index.html
          test -f web/lead-agent/engine.mjs
          test -f web/lead-agent/app.mjs
          test -f web/lead-agent/lead-agent.css
          test -f web/interoperability.html
          test -f web/bootstrap.sh
          # The lead agent console may call only a server on this machine that the visitor connects;
          # automation/tests/test_lead_agent_console.py checks that boundary.
          ! grep -RIE '(fetch\(|XMLHttpRequest|WebSocket|sendBeacon|navigator\.serviceWorker)' web --include='*.mjs' --include='*.js' --exclude=app.mjs
          ! grep -IE '(fetch\(|XMLHttpRequest|WebSocket|sendBeacon|navigator\.serviceWorker)' web/app.mjs web/maturity/app.mjs
          test "$(grep -cE 'fetch\(' web/lead-agent/app.mjs)" = 2
          ! grep -IE '(XMLHttpRequest|WebSocket|sendBeacon|navigator\.serviceWorker)' web/lead-agent/app.mjs
          python -B automation/scripts/generate_browser_contract_bundle.py --check
          python -B automation/scripts/generate_maturity_catalog.py --check
          node --check web/app.mjs
          node --check web/start.mjs
          node --check web/connect-copy.mjs
          node --check web/zip-store.mjs
          node --check web/governance-engine.mjs
          node --check web/finding-guidance.mjs
          node --check web/maturity/app.mjs
          node --check web/maturity/maturity-engine.mjs
          node --check web/maturity/maturity-viewer.mjs
          node --check web/maturity/catalog.generated.mjs
          node --check web/lead-agent/engine.mjs
          node --check web/lead-agent/app.mjs
          node web/tests/lead-agent-runner.mjs > /dev/null

      - name: Stage static site
        shell: bash
        run: |
          python3 automation/scripts/render_docs_html.py
          python3 automation/scripts/stamp_sitemap_lastmod.py
          mkdir _site
          cp -R web/. _site/
          cp docs/AGENT_SETUP.md _site/AGENT_SETUP.md
          cp docs/JOURNEYS.md _site/JOURNEYS.md
          test -f _site/404.html
          test -f _site/AGENT_SETUP.html
          test -f _site/JOURNEYS.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site


  e2e-lead-agent:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve staged site and run Lead Agent E2E
        shell: bash
        run: |
          mkdir -p _site
          cp -R web/. _site/
          python -m http.server 8799 --directory _site &
          echo $! > /tmp/site.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8799/lead-agent/ >/dev/null && break
            sleep 0.5
          done
          CHROME_PATH="$(python -c 'from pathlib import Path; cands=list(Path.home().joinpath(".cache/ms-playwright").glob("chromium-*/chrome-linux*/chrome")); print(cands[0] if cands else "")')"
          test -n "$CHROME_PATH"
          node web/tests/lead-agent-e2e.mjs http://127.0.0.1:8799/ "$CHROME_PATH"
          kill "$(cat /tmp/site.pid)" || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: [build, e2e-lead-agent]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
