name: Static browser Pages deployment

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify static browser boundary
        shell: bash
        run: |
          test -f web/index.html
          test -f web/app.mjs
          test -f web/governance-engine.mjs
          test -f web/finding-guidance.mjs
          test -f web/contracts.generated.mjs
          test -f web/styles.css
          test -f web/machine-interface.json
          test -f web/ai-system-inventory-template.csv
          test -f web/sample-ai-inventory.csv
          ! grep -RIE '(fetch\(|XMLHttpRequest|WebSocket|sendBeacon|navigator\.serviceWorker)' web --include='*.mjs' --include='*.js'
          python -B automation/scripts/generate_browser_contract_bundle.py --check
          node --check web/app.mjs
          node --check web/governance-engine.mjs
          node --check web/finding-guidance.mjs

      - name: Stage static site
        shell: bash
        run: |
          mkdir _site
          cp -R web/. _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
