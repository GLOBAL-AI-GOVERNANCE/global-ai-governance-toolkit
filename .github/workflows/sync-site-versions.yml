name: Sync site versions

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [suite-release]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-site-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pull suite-manifest and refresh pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B automation/scripts/sync_site_from_manifest.py
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status -sb
            git diff --stat
          fi
      - name: Open or refresh sync pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/site-versions-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "$(cat <<'MSG'
          Sync site versions from suite-manifest

          Regenerated by automation/scripts/sync_site_from_manifest.py from the
          profile suite-manifest.json (GitHub release tags).
          MSG
          )"
          git push -u origin HEAD
          PR_URL="$(gh pr create --title "Sync site versions from suite-manifest" --body "$(cat <<'BODY'
          ## Summary
          Automated pin refresh for AGENT_SETUP, JOURNEYS, bootstrap, connect, index, llms.txt, machine-interface, and suite-pins.json from the profile suite-manifest.

          ## Test plan
          - [ ] governance-checks green
          - [ ] auto-merge squash when required checks pass
          BODY
          )")"
          echo "Opened $PR_URL"
          gh pr merge --auto --squash "$PR_URL" || true
